# Perfil para probar en la compu sin tocar la base real:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
# Usa una base H2 en memoria (se borra al cerrar).
spring.datasource.url=jdbc:h2:mem:totonitos;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.docker.compose.enabled=false
app.admin.username=demo
app.admin.password=demo1234
jwt.secret=clave-local-solo-para-desarrollo-0123456789
